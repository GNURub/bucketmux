server:
  addr: ":8080"
  data_dir: "/data"
  # Mount this path on shared storage in multi-instance deployments.
  multipart_staging_dir: "/data/multipart"
  max_upload_bytes: 5368709120 # 5 GiB total object size
  max_multipart_part_bytes: 536870912 # 512 MiB per part
  max_admin_body_bytes: 1048576 # 1 MiB for non-upload admin mutations
  # Deprecated but still supported. Prefer store.sqlite.path.
  db_path: "/data/switcher.db"
  # Optional. Use when BucketMux runs behind a reverse proxy/path and admin-generated
  # presigned public URLs must point to the external origin.
  public_base_url: "https://files.example.com"
  # Prefer MASTER_KEY env var in production.
  master_key: "change-me-use-a-long-random-secret"

store:
  # sqlite uses Turso Database as the embedded SQLite-compatible engine.
  kind: "sqlite" # sqlite | postgres
  sqlite:
    path: "/data/switcher.db"
    max_open_conns: 10
    max_idle_conns: 10
  postgres:
    dsn: "postgres://bucketmux:bucketmux@postgres:5432/bucketmux?sslmode=disable"
    max_open_conns: 25
    max_idle_conns: 10
  vector_search:
    # Turso uses its native exact vector functions. Postgres auto uses pgvector when available.
    backend: "auto" # auto | exact | pgvector
    hnsw_m: 16
    ef_construction: 64
    ef_search: 100
    max_scan_tuples: 20000
    max_profiles: 64 # one HNSW partial index per kind/model/version/metric/dimension profile

coordination:
  # database works for single and multi-instance deployments through DB job claims.
  # redis adds a short distributed lease around background workers.
  kind: "database" # database | redis
  redis:
    addr: "redis:6379"
    password: ""
    db: 0
    key_prefix: "bucketmux"
    lease_ttl_seconds: 5

s3:
  access_key: "local-access-key"
  secret_key: "local-secret-key"
  region: "auto"

admin:
  enabled: true
  username: "admin"
  password: "change-me"
  # Optional OpenID Connect login. Basic Auth remains available when username/password are set.
  oidc:
    enabled: false
    issuer_url: "https://id.example.com"
    client_id: "bucketmux"
    client_secret: "" # Prefer ADMIN_OIDC_CLIENT_SECRET in production.
    redirect_url: "https://files.example.com/admin/oidc/callback"
    scopes: ["openid", "profile", "email"]
    allowed_groups: ["storage-admins"]
    session_hours: 8

wasm_plugins:
  enabled: true
  max_module_bytes: 16777216 # 16 MiB executable payload
  default_timeout_millis: 30000
  default_memory_limit_bytes: 134217728 # 128 MiB linear memory
  default_max_input_bytes: 536870912 # 512 MiB source object
  default_max_output_bytes: 536870912 # aggregate declared outputs
  default_max_attempts: 3

buckets:
  - name: "images"
    replication_enabled: false
    # Optional: provider IDs where objects in this bucket should be replicated.
    # Empty or omitted means no replication.
    replication_provider_ids: []
    # Omitted protection fields preserve settings changed through the admin UI.
    versioning_enabled: true
    trash_enabled: true
    trash_retention_days: 30
    object_lock_enabled: false
    default_retention_mode: "GOVERNANCE" # GOVERNANCE | COMPLIANCE
    default_retention_days: 0
    lifecycle_rules:
      - id: "expire-temporary"
        prefix: "tmp/"
        expire_after_days: 7
        purge_trash_after_days: 30
        enabled: true

providers:
  # Optional local hard-drive provider. Remove this block if you only want remote providers.
  - id: "local-default"
    name: "Local hard-drive storage"
    kind: "local"
    bucket: "images"
    capacity_bytes: 10737418240
    priority: 100
    enabled: true
    settings:
      # Absolute paths are used as-is. Relative paths are resolved under server.data_dir.
      path: "/data/local-provider"
      # Optional routing policies:
      # lower cost wins when provider priority is tied.
      cost_per_gb_month: "0"
      # skip this provider for larger objects.
      max_object_size_bytes: "0"
      # keep free space reserved after each routed upload.
      min_free_bytes: "0"
      # atomic reservation margin and optional UTC-month upload allowance.
      quota_margin_bytes: "0"
      monthly_upload_quota_bytes: "0"
      quota_alert_threshold_percent: "85"

  # Cloudflare R2 / Backblaze B2 / MinIO / GCS XML API style provider.
  # - id: "r2-main"
  #   name: "Cloudflare R2 main"
  #   kind: "s3-compatible"
  #   endpoint: "https://ACCOUNT_ID.r2.cloudflarestorage.com"
  #   region: "auto"
  #   bucket: "images"
  #   access_key: "..."
  #   secret_key: "..."
  #   capacity_bytes: 10737418240
  #   priority: 10
  #   enabled: true

  # Additional tested S3-compatible presets use the same deep adapter:
  # IDrive e2:        https://s3.REGION.idrivee2.com
  # DigitalOcean:     https://REGION.digitaloceanspaces.com
  # Hetzner:          https://LOCATION.your-objectstorage.com
  # Scaleway:         https://s3.REGION.scw.cloud
  # OVHcloud:         paste the exact regional endpoint shown in the OVH console
  # Akamai/Linode:    paste the assigned *.linodeobjects.com S3 endpoint
  # OCI Object Store: https://NAMESPACE.compat.objectstorage.REGION.oraclecloud.com
  # OCI requires Customer Secret Keys for the S3 Compatibility API.

  # Native Microsoft Azure Blob Storage adapter. access_key is the storage
  # account name and secret_key is a base64 account key.
  # - id: "azure-main"
  #   name: "Azure Blob main"
  #   kind: "azure-blob"
  #   endpoint: "https://ACCOUNT.blob.core.windows.net"
  #   bucket: "images" # Azure container
  #   access_key: "ACCOUNT"
  #   secret_key: "BASE64_ACCOUNT_KEY"
  #   capacity_bytes: 107374182400
  #   priority: 20
  #   enabled: true

  # SeaweedFS S3 API backend. Start SeaweedFS with:
  # docker run -p 8333:8333 -e AWS_ACCESS_KEY_ID=admin -e AWS_SECRET_ACCESS_KEY=secret -e S3_BUCKET=images chrislusf/seaweedfs
  # - id: "seaweedfs-local"
  #   name: "SeaweedFS local S3"
  #   kind: "s3-compatible"
  #   endpoint: "http://localhost:8333"
  #   region: "us-east-1"
  #   bucket: "images"
  #   access_key: "admin"
  #   secret_key: "secret"
  #   capacity_bytes: 107374182400
  #   priority: 20
  #   enabled: true

  # Vercel Blob provider. Not S3-native; uses the Vercel Blob API adapter.
  # Use a Vercel BLOB_READ_WRITE_TOKEN as secret_key.
  # Keep endpoint empty unless you need to override the official API URL.
  # - id: "vercel-blob-main"
  #   name: "Vercel Blob main"
  #   kind: "vercel-blob"
  #   endpoint: "https://vercel.com/api/blob"
  #   bucket: "vercel"
  #   access_key: ""
  #   secret_key: "vercel_blob_rw_STOREID_SECRET"
  #   capacity_bytes: 10737418240
  #   priority: 50
  #   enabled: true
  #   settings:
  #     # public or private. Defaults to public.
  #     access: "public"
  #     # Optional if the token contains the store id.
  #     store_id: "STOREID"
  #     # Optional cache-control max age in seconds for uploads.
  #     cache_control_max_age: "2592000"

  # Cloudinary provider. Not S3-native; uses a media API adapter.
  # - id: "cloudinary-free"
  #   name: "Cloudinary free"
  #   kind: "cloudinary"
  #   bucket: "CLOUD_NAME"
  #   access_key: "API_KEY"
  #   secret_key: "API_SECRET"
  #   capacity_bytes: 1073741824
  #   priority: 200
  #   enabled: true
  #   settings:
  #     cloud_name: "CLOUD_NAME"
