services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bucketmux
      POSTGRES_USER: bucketmux
      POSTGRES_PASSWORD: ${BUCKETMUX_POSTGRES_PASSWORD:-bucketmux}
    volumes:
      - bucketmux-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bucketmux -d bucketmux"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  bucketmux-a:
    build: .
    image: bucketmux:local
    environment: &bucketmux-env
      CONFIG_PATH: /config/config.yaml
      MASTER_KEY: ${BUCKETMUX_MASTER_KEY:-replace-with-a-long-random-secret}
      S3_ACCESS_KEY: ${BUCKETMUX_S3_ACCESS_KEY:-local-access-key}
      S3_SECRET_KEY: ${BUCKETMUX_S3_SECRET_KEY:-local-secret-key}
      ADMIN_ENABLED: "true"
      ADMIN_USER: ${BUCKETMUX_ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${BUCKETMUX_ADMIN_PASSWORD:-change-me}
      STORE_KIND: postgres
      POSTGRES_DSN: postgres://bucketmux:${BUCKETMUX_POSTGRES_PASSWORD:-bucketmux}@postgres:5432/bucketmux?sslmode=disable
      POSTGRES_MAX_OPEN_CONNS: 25
      POSTGRES_MAX_IDLE_CONNS: 10
    volumes:
      - ./examples/config.multiple.yaml:/config/config.yaml:ro
      - bucketmux-a-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    restart: unless-stopped

  bucketmux-b:
    build: .
    image: bucketmux:local
    environment:
      <<: *bucketmux-env
    volumes:
      - ./examples/config.multiple.yaml:/config/config.yaml:ro
      - bucketmux-b-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./examples/nginx.bucketmux.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - bucketmux-a
      - bucketmux-b
    restart: unless-stopped

volumes:
  bucketmux-postgres:
  bucketmux-a-data:
  bucketmux-b-data:
