upstream bucketmux_instances {
    ip_hash;
    server bucketmux-a:8080 max_fails=1 fail_timeout=2s;
    server bucketmux-b:8080 max_fails=1 fail_timeout=2s;
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 5g;
    proxy_request_buffering off;
    proxy_buffering off;

    location / {
        proxy_pass http://bucketmux_instances;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        add_header X-BucketMux-Upstream $upstream_addr always;
    }
}
