server:
  addr: ":8080"
  data_dir: "/data"
  multipart_staging_dir: "/data/multipart"
  max_upload_bytes: 5368709120
  max_multipart_part_bytes: 536870912
  max_admin_body_bytes: 1048576
  master_key: "change-me-use-MASTER_KEY-env"

store:
  kind: "sqlite"
  sqlite:
    path: "/data/switcher.db"
    max_open_conns: 4
    max_idle_conns: 4

s3:
  access_key: "local-access-key"
  secret_key: "local-secret-key"
  region: "auto"

admin:
  enabled: true
  username: "admin"
  password: "change-me"

buckets:
  - name: "images"
    replication_enabled: false
    replication_provider_ids: []

providers:
  - id: "local-default"
    name: "Local Docker volume"
    kind: "local"
    bucket: "images"
    capacity_bytes: 10737418240
    priority: 100
    enabled: true
    settings:
      path: "/data/local-provider"
