limit_req_zone $binary_remote_addr zone=bucketmux_requests:10m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=bucketmux_connections:10m;

upstream bucketmux_instances {
    # Affinity reduces cross-node traffic; shared staging keeps multipart resumable after failover.
    ip_hash;
    server bucketmux-a:8080 max_fails=1 fail_timeout=5s;
    server bucketmux-b:8080 max_fails=1 fail_timeout=5s;
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 5g;
    proxy_request_buffering off;
    proxy_buffering off;
    limit_req zone=bucketmux_requests burst=200 nodelay;
    limit_req_status 429;
    limit_conn bucketmux_connections 50;
    limit_conn_status 429;

    location / {
        proxy_pass http://bucketmux_instances;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5m;
        proxy_send_timeout 5m;
        # Preserve a non-standard external port because SigV4 signs Host.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
