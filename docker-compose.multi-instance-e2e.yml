services:
  ministack:
    image: ministackorg/ministack:1.5.2@sha256:a256465a057d4dc75e36b8ce9beccdd64cbbbd5abc6925719764c1b06835047f
    environment:
      LOG_LEVEL: WARNING
      S3_PERSIST: "0"
    healthcheck:
      test: ["CMD", "awslocal", "s3api", "list-buckets"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  ministack-replica:
    image: ministackorg/ministack:1.5.2@sha256:a256465a057d4dc75e36b8ce9beccdd64cbbbd5abc6925719764c1b06835047f
    environment:
      LOG_LEVEL: WARNING
      S3_PERSIST: "0"
    healthcheck:
      test: ["CMD", "awslocal", "s3api", "list-buckets"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  postgres:
    image: pgvector/pgvector:0.8.6-pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_DB: bucketmux
      POSTGRES_USER: bucketmux
      POSTGRES_PASSWORD: multi-instance-postgres
    volumes:
      - multi-instance-postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${MULTI_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bucketmux -d bucketmux"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "multi-instance-redis"]
    environment:
      REDIS_PASSWORD: multi-instance-redis
    volumes:
      - multi-instance-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 2s
      timeout: 2s
      retries: 30

  multipart-init:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /multipart && chown 10001:10001 /multipart && chmod 0750 /multipart"]
    volumes:
      - multi-instance-multipart:/multipart

  bucketmux-a:
    build: .
    image: bucketmux:multi-instance-e2e
    environment: &bucketmux-environment
      CONFIG_PATH: /config/config.yaml
      MASTER_KEY: 0123456789abcdef0123456789abcdef
      S3_ACCESS_KEY: multi-instance-access
      S3_SECRET_KEY: multi-instance-secret
      S3_REGION: us-east-1
      ADMIN_ENABLED: "true"
      ADMIN_USER: multi-admin
      ADMIN_PASSWORD: multi-password
      STORE_KIND: postgres
      POSTGRES_DSN: postgres://bucketmux:multi-instance-postgres@postgres:5432/bucketmux?sslmode=disable
      POSTGRES_MAX_OPEN_CONNS: 20
      POSTGRES_MAX_IDLE_CONNS: 10
      VECTOR_SEARCH_BACKEND: pgvector
      COORDINATION_KIND: redis
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: multi-instance-redis
      REDIS_KEY_PREFIX: bucketmux-multi-e2e
      PUBLIC_BASE_URL: http://127.0.0.1:${MULTI_PROXY_PORT:-18084}
      MULTIPART_STAGING_DIR: /multipart
    volumes:
      - ./test/e2e/multi_instance/config.yaml:/config/config.yaml:ro
      - multi-instance-a-data:/data
      - multi-instance-multipart:/multipart
    ports:
      - "127.0.0.1:${MULTI_A_PORT:-18082}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ministack:
        condition: service_healthy
      ministack-replica:
        condition: service_healthy
      multipart-init:
        condition: service_completed_successfully
    healthcheck:
      interval: 2s
      timeout: 2s
      start_period: 2s
      retries: 30
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  bucketmux-b:
    build: .
    image: bucketmux:multi-instance-e2e
    environment:
      <<: *bucketmux-environment
    volumes:
      - ./test/e2e/multi_instance/config.yaml:/config/config.yaml:ro
      - multi-instance-b-data:/data
      - multi-instance-multipart:/multipart
    ports:
      - "127.0.0.1:${MULTI_B_PORT:-18083}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ministack:
        condition: service_healthy
      ministack-replica:
        condition: service_healthy
      multipart-init:
        condition: service_completed_successfully
    healthcheck:
      interval: 2s
      timeout: 2s
      start_period: 2s
      retries: 30
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  bucketmux-restore:
    profiles: ["restore-test"]
    image: bucketmux:multi-instance-e2e
    environment:
      <<: *bucketmux-environment
      POSTGRES_DSN: postgres://bucketmux:multi-instance-postgres@postgres:5432/bucketmux_restore?sslmode=disable
    volumes:
      - ./test/e2e/multi_instance/config.yaml:/config/config.yaml:ro
      - multi-instance-restore-data:/data
      - multi-instance-multipart:/multipart
    ports:
      - "127.0.0.1:${MULTI_RESTORE_PORT:-18085}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ministack:
        condition: service_healthy
      ministack-replica:
        condition: service_healthy
      multipart-init:
        condition: service_completed_successfully
    healthcheck:
      interval: 2s
      timeout: 2s
      start_period: 2s
      retries: 30
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  proxy:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    ports:
      - "127.0.0.1:${MULTI_PROXY_PORT:-18084}:8080"
    volumes:
      - ./test/e2e/multi_instance/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      bucketmux-a:
        condition: service_healthy
      bucketmux-b:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 2s
      timeout: 2s
      start_period: 2s
      retries: 30

volumes:
  multi-instance-postgres:
  multi-instance-redis:
  multi-instance-a-data:
  multi-instance-b-data:
  multi-instance-multipart:
  multi-instance-restore-data:
